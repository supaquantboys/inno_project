<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>B300 Inventory Workspace</title>
    <link rel="stylesheet" href="./assets/css/inventory.css" />
    <style>
      .internal-head {
        display: none !important;
      }
      .layout {
        min-height: 100vh !important;
      }
    </style>
    <script>
      (() => {
        let s = null;
        try {
          s = JSON.parse(sessionStorage.getItem("b300_auth_session") || "null");
        } catch (_) {}
        if (!s || s.workspace !== "v2" || s.username !== "inventory")
          location.replace("./");
      })();
    </script>
    <link rel="stylesheet" href="./assets/css/workspace.css" />
    <link rel="stylesheet" href="./license.css" />
    <link rel="stylesheet" href="./assets/css/workspace-chrome.css" />
  </head>
  <body>
    <div id="app" class="app"></div>
    <script src="./assets/js/inventory/model.js"></script>
    <script src="./assets/js/inventory/forms.js"></script>
    <script src="./assets/js/inventory/actions.js"></script>
    <script src="./assets/js/inventory/views.js"></script>
    <script src="./assets/js/inventory/lab.js"></script>
    <script src="./assets/js/inventory/shared-records.js"></script>
    <script src="./assets/js/inventory/packaged-and-stamps.js"></script>
    <script src="./assets/js/inventory/action-boundary.js"></script>
    <script src="./assets/js/inventory/workspace.js"></script>
    <script src="./assets/js/inventory/entitlements.js"></script>
    <script src="./assets/js/workspace-chrome.js"></script>
  </body>
</html>
