<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B300 Compliance Cloud</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                        },
                        slate: {
                            850: '#151e2e'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        const Icons = {
            Dashboard: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>,
            Database: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>,
            FileText: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>,
            List: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
            Search: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Download: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
            Upload: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>,
            AlertCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            Lock: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>,
            Unlock: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>,
            Close: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Eye: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>,
            Info: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            FileUp: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        };

        const TRANSACTION_TYPES = ["Additions to Inventory", "Reductions to Inventory", "Adjustments", "Internal Transfer / Retention"];
        const CATEGORIES = {
            "Additions to Inventory": [
                "Total Production",
                "Quantity Received in Canada",
                "Quantity Imported into Canada",
                "Quantity Transferred from Vegetative Cannabis Plant"
            ],
            "Reductions to Inventory": [
                "Quantity Packaged",
                "Quantity Taken for Further Processing or Planted",
                "Plant Harvested",
                "Quantity Sold in Canada",
                "Quantity Exported Outside Canada",
                "Quantity Incurred as Drying or Processing Loss",
                "Quantity Destroyed",
                "Quantity Sent for Analysis",
                "Quantity Transferred to Whole Cannabis Plant",
                "Quantity Taken to Produce Low-THC Cannabis Products and Prescription Cannabis Drugs",
                "Other"
            ],
            "Adjustments": [
                "Manual Count Adjustment",
                "System Correction"
            ],
            "Internal Transfer / Retention": [
                "Health Canada Retention Sample"
            ]
        };
        const PRODUCT_TYPES = [
            "Dried/Fresh Flowering kg",
            "Dried/Fresh Non-flowering kg",
            "Whole Plants",
            "Viable Seeds",
            "Vegetative Plants",
            "Pure Intermediates kg",
            "Finished Extracts mg THC",
            "Finished Edible mg THC",
            "Finished Topicals mg THC"
        ];

        const generateLogId = () => {
            const date = new Date();
            const yyyy = date.getUTCFullYear();
            const mm = String(date.getUTCMonth() + 1).padStart(2, '0');
            const dd = String(date.getUTCDate()).padStart(2, '0');
            const random = Math.floor(Math.random() * 1000000).toString().padStart(6, '0');
            return `B300-${yyyy}${mm}${dd}-${random}`;
        };

        const generateBatchId = (prefix) => {
            const random = Math.floor(Math.random() * 1000000).toString().padStart(6, '0');
            return `${prefix}-${random}`;
        };

        const formatDate = (isoString) => {
            if (!isoString) return '';
            const d = new Date(isoString);
            return d.toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
        };

        const csvToObj = (csv) => {
            const lines = csv.split('\n').filter(l => l.trim());
            if (lines.length < 2) return [];
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const obj = {};
                let currentline = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                if(!currentline) continue;
                
                for (let j = 0; j < headers.length; j++) {
                    let val = currentline[j] || "";
                    obj[headers[j]] = val.replace(/^"|"$/g, '').replace(/""/g, '"').trim();
                }
                result.push(obj);
            }
            return result;
        };

        const objToCsv = (arr) => {
            if (arr.length === 0) return "";
            const headers = Object.keys(arr[0]);
            const headerRow = headers.map(h => `"${h}"`).join(',');
            const rows = arr.map(row => {
                return headers.map(h => {
                    let val = row[h] !== null && row[h] !== undefined ? String(row[h]) : '';
                    return `"${val.replace(/"/g, '""')}"`;
                }).join(',');
            });
            return [headerRow, ...rows].join('\n');
        };

        const useToast = () => {
            const [toast, setToast] = useState(null);
            
            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };

            const ToastComponent = () => {
                if (!toast) return null;
                const isSuccess = toast.type === 'success';
                return (
                    <div className="fixed bottom-4 right-4 z-50 flex items-center p-4 mb-4 text-sm rounded-lg shadow-lg bg-white border border-slate-200" role="alert">
                        <div className={`inline-flex items-center justify-center flex-shrink-0 w-8 h-8 rounded-lg ${isSuccess ? 'text-green-500 bg-green-100' : 'text-red-500 bg-red-100'}`}>
                            {isSuccess ? <Icons.Check /> : <Icons.AlertCircle />}
                        </div>
                        <div className="ml-3 text-sm font-medium text-slate-800">{toast.message}</div>
                    </div>
                );
            };

            return { showToast, ToastComponent };
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-40 flex items-center justify-center">
                    <div className="fixed inset-0 bg-slate-900 bg-opacity-50 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative z-50 w-full max-w-lg bg-white rounded-xl shadow-2xl flex flex-col max-h-[90vh]">
                        <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100">
                            <h3 className="text-lg font-semibold text-slate-800">{title}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 transition-colors">
                                <Icons.Close />
                            </button>
                        </div>
                        <div className="p-6 overflow-y-auto">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white rounded-xl border border-slate-200 shadow-sm ${className}`}>
                {children}
            </div>
        );

        const ConfirmModal = ({ isOpen, onClose, onConfirm, title, message }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center">
                    <div className="fixed inset-0 bg-slate-900 bg-opacity-60 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative z-[60] w-full max-w-sm bg-white rounded-xl shadow-2xl p-6">
                        <div className="flex items-center gap-3 text-amber-500 mb-4">
                            <Icons.AlertCircle />
                            <h3 className="text-lg font-bold text-slate-800">{title}</h3>
                        </div>
                        <p className="text-sm text-slate-600 mb-6">{message}</p>
                        <div className="flex justify-end gap-3">
                            <button onClick={onClose} className="px-4 py-2 text-sm font-medium text-slate-700 bg-slate-100 rounded-lg hover:bg-slate-200">Cancel</button>
                            <button onClick={() => { onConfirm(); onClose(); }} className="px-4 py-2 text-sm font-medium text-white bg-amber-600 rounded-lg hover:bg-amber-700">Confirm</button>
                        </div>
                    </div>
                </div>
            );
        };

        const DashboardView = ({ transactions }) => {
            const totalEntries = transactions.length;
            const pendingRequests = transactions.filter(t => t.status === 'Pending Edit').length;
            
            const inventory = useMemo(() => {
                const balances = {};
                transactions.forEach(t => {
                    const qty = parseFloat(t.quantity) || 0;
                    if (!balances[t.productType]) balances[t.productType] = 0;
                    if (t.type === "Additions to Inventory") balances[t.productType] += qty;
                    else if (t.type === "Reductions to Inventory") balances[t.productType] -= qty;
                    else if (t.type === "Adjustments") balances[t.productType] += qty;
                });
                return balances;
            }, [transactions]);

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold text-slate-800">Dashboard</h2>
                        <p className="text-slate-500 mt-1">Overview of your compliance operations.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <Card className="p-6">
                            <div className="flex items-center space-x-4">
                                <div className="p-3 bg-blue-50 text-blue-600 rounded-lg"><Icons.List /></div>
                                <div>
                                    <p className="text-sm font-medium text-slate-500">Total Transactions</p>
                                    <p className="text-2xl font-bold text-slate-800">{totalEntries}</p>
                                </div>
                            </div>
                        </Card>
                        <Card className="p-6">
                            <div className="flex items-center space-x-4">
                                <div className="p-3 bg-amber-50 text-amber-600 rounded-lg"><Icons.AlertCircle /></div>
                                <div>
                                    <p className="text-sm font-medium text-slate-500">Pending Edits</p>
                                    <p className="text-2xl font-bold text-slate-800">{pendingRequests}</p>
                                </div>
                            </div>
                        </Card>
                        <Card className="p-6">
                            <div className="flex items-center space-x-4">
                                <div className="p-3 bg-brand-50 text-brand-600 rounded-lg"><Icons.Database /></div>
                                <div>
                                    <p className="text-sm font-medium text-slate-500">Tracked Products</p>
                                    <p className="text-2xl font-bold text-slate-800">{Object.keys(inventory).length}</p>
                                </div>
                            </div>
                        </Card>
                    </div>

                    <Card className="p-6">
                        <h3 className="text-lg font-semibold text-slate-800 mb-4">Inventory Snapshot</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-slate-50 text-slate-500">
                                    <tr>
                                        <th className="px-4 py-3 font-medium rounded-l-lg">Product Type</th>
                                        <th className="px-4 py-3 font-medium rounded-r-lg text-right">Current Balance</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {Object.entries(inventory).map(([product, balance], idx) => (
                                        <tr key={idx} className="hover:bg-slate-50 transition-colors">
                                            <td className="px-4 py-3 font-medium text-slate-800">{product}</td>
                                            <td className="px-4 py-3 text-right">
                                                <span className={`px-2 py-1 rounded-md font-semibold ${balance < 0 ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-700'}`}>
                                                    {balance.toFixed(3)}
                                                </span>
                                            </td>
                                        </tr>
                                    ))}
                                    {Object.keys(inventory).length === 0 && (
                                        <tr>
                                            <td colSpan="2" className="px-4 py-8 text-center text-slate-500">No inventory data available yet.</td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </Card>
                </div>
            );
        };

        const SettingsView = ({ settings, setSettings, showToast }) => {
            const handleAdd = (category) => {
                const val = prompt(`Add new ${category}:`);
                if (val && val.trim()) {
                    setSettings(prev => ({
                        ...prev,
                        [category]: [...prev[category], val.trim()]
                    }));
                    showToast(`Added to ${category}`);
                }
            };

            const handleRemove = (category, idx) => {
                setSettings(prev => ({
                    ...prev,
                    [category]: prev[category].filter((_, i) => i !== idx)
                }));
                showToast(`Removed from ${category}`);
            };

            const SettingSection = ({ title, categoryKey }) => (
                <Card className="p-6">
                    <div className="flex justify-between items-center mb-4">
                        <h3 className="text-md font-semibold text-slate-800">{title}</h3>
                        <button onClick={() => handleAdd(categoryKey)} className="text-sm text-brand-600 hover:text-brand-800 flex items-center gap-1 font-medium">
                            <Icons.Plus /> Add New
                        </button>
                    </div>
                    <ul className="divide-y divide-slate-100">
                        {settings[categoryKey]?.length === 0 && <li className="py-2 text-sm text-slate-500">No items configured.</li>}
                        {settings[categoryKey]?.map((item, idx) => (
                            <li key={idx} className="py-3 flex justify-between items-center group">
                                <span className="text-sm text-slate-700">{item}</span>
                                <button onClick={() => handleRemove(categoryKey, idx)} className="text-slate-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <Icons.Trash />
                                </button>
                            </li>
                        ))}
                    </ul>
                </Card>
            );

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold text-slate-800">System Settings</h2>
                        <p className="text-slate-500 mt-1">Manage dropdown lists and application configurations.</p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <SettingSection title="Locations" categoryKey="locations" />
                        <SettingSection title="Strains / Production Info" categoryKey="strains" />
                        <SettingSection title="Destruction Reasons" categoryKey="destructionReasons" />
                        <SettingSection title="Witness Persons" categoryKey="witnesses" />
                        <SettingSection title="Destruction Persons" categoryKey="destructionPersons" />
                        <SettingSection title="Destruction Methods" categoryKey="destructionMethods" />
                    </div>
                </div>
            );
        };

        const TransactionsView = ({ transactions, setTransactions, userRole, showToast, settings, setSettings }) => {
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [isEditModalOpen, setIsEditModalOpen] = useState(false);
            const [viewDetails, setViewDetails] = useState(null);
            
            const [searchTerm, setSearchTerm] = useState("");
            const [filterType, setFilterType] = useState("All");

            const [showAdvanced, setShowAdvanced] = useState(false);
            const [advStartDate, setAdvStartDate] = useState("");
            const [advEndDate, setAdvEndDate] = useState("");
            const [advSearchField, setAdvSearchField] = useState("All");
            const [advExactMatch, setAdvExactMatch] = useState(false);

            const [confirmOtherOpen, setConfirmOtherOpen] = useState(false);
            const [pendingCategory, setPendingCategory] = useState(null);
            const [isEditingConfirm, setIsEditingConfirm] = useState(false);

        const B300View = ({ transactions, showToast }) => {
            const [startDate, setStartDate] = useState(() => {
                const d = new Date();
                d.setDate(1);
                return d.toISOString().split('T')[0];
            });
            const [endDate, setEndDate] = useState(() => {
                const d = new Date();
                return d.toISOString().split('T')[0];
            });
            const [report, setReport] = useState(null);

            const generateReport = () => {
                const start = new Date(startDate);
                const end = new Date(endDate);
                end.setHours(23, 59, 59, 999);

                if (start > end) {
                    showToast("Start date cannot be after end date", "error");
                    return;
                }

                const reportData = PRODUCT_TYPES.map(prod => {
                    let opening = 0, additions = 0, reductions = 0;
                    
                    transactions.forEach(t => {
                        if (t.productType !== prod) return;
                        
                        const tDate = new Date(t.timestamp);
                        const qty = parseFloat(t.quantity);

                        if (tDate < start) {
                            if (t.type === "Additions to Inventory") opening += qty;
                            else if (t.type === "Reductions to Inventory") opening -= qty;
                        } else if (tDate >= start && tDate <= end) {
                            if (t.type === "Additions to Inventory") additions += qty;
                            else if (t.type === "Reductions to Inventory") reductions += qty;
                        }
                    });

                    return {
                        product: prod,
                        opening: opening.toFixed(3),
                        additions: additions.toFixed(3),
                        reductions: reductions.toFixed(3),
                        closing: (opening + additions - reductions).toFixed(3)
                    };
                });

                setReport(reportData);
                showToast("B300 Report Generated successfully.");
            };

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold text-slate-800">CRA B300 Generator</h2>
                        <p className="text-slate-500 mt-1">Automatically compile inventory balances for your information return.</p>
                    </div>

                    <Card className="p-6 bg-slate-50 border border-slate-200 border-l-4 border-l-brand-600">
                        <div className="flex flex-col sm:flex-row gap-4 items-end">
                            <div className="w-full sm:w-1/3">
                                <label className="block text-sm font-medium text-slate-700 mb-1">Start Date</label>
                                <input type="date" value={startDate} onChange={(e)=>setStartDate(e.target.value)} className="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white" />
                            </div>
                            <div className="w-full sm:w-1/3">
                                <label className="block text-sm font-medium text-slate-700 mb-1">End Date</label>
                                <input type="date" value={endDate} onChange={(e)=>setEndDate(e.target.value)} className="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white" />
                            </div>
                            <div className="w-full sm:w-1/3">
                                <button onClick={generateReport} className="w-full px-4 py-2 text-sm font-medium text-white bg-slate-800 rounded-lg hover:bg-slate-900 transition-colors shadow-sm flex justify-center items-center gap-2">
                                    <Icons.FileText /> Generate Preview
                                </button>
                            </div>
                        </div>
                    </Card>

                    {report && (
                        <Card className="p-0 overflow-hidden">
                            <div className="p-6 bg-white border-b border-slate-100 flex justify-between items-center">
                                <div>
                                    <h3 className="text-lg font-bold text-slate-800">B300 Snapshot</h3>
                                    <p className="text-sm text-slate-500">Period: {startDate} to {endDate}</p>
                                </div>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm whitespace-nowrap">
                                    <thead className="bg-slate-800 text-slate-100 font-medium">
                                        <tr>
                                            <th className="px-4 py-3">Product Type</th>
                                            <th className="px-4 py-3 text-right">Opening Inventory (A)</th>
                                            <th className="px-4 py-3 text-right">Additions (B)</th>
                                            <th className="px-4 py-3 text-right">Reductions (C)</th>
                                            <th className="px-4 py-3 text-right">Closing Inventory (A+B-C)</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {report.map((row, i) => (
                                            <tr key={i} className="hover:bg-slate-50 transition-colors">
                                                <td className="px-4 py-3 font-medium text-slate-800">{row.product}</td>
                                                <td className="px-4 py-3 text-right text-slate-600">{row.opening}</td>
                                                <td className="px-4 py-3 text-right text-green-600 font-medium">+{row.additions}</td>
                                                <td className="px-4 py-3 text-right text-red-600 font-medium">-{row.reductions}</td>
                                                <td className="px-4 py-3 text-right font-bold text-slate-900 bg-slate-50">{row.closing}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </Card>
                    )}
                </div>
            );
        };

        const DatabaseView = ({ transactions, setTransactions, showToast }) => {
            const handleExport = () => {
                const csvData = objToCsv(transactions);
                const blob = new Blob([csvData], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `b300-database-${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
                window.URL.revokeObjectURL(url);
                showToast("Database exported successfully.");
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const csvText = evt.target.result;
                        const data = csvToObj(csvText);
                        if (data && data.length > 0 && data[0].logId) {
                            setTransactions(data);
                            showToast("Database imported successfully!");
                        } else {
                            showToast("Invalid CSV format. Missing required columns.", "error");
                        }
                    } catch (err) {
                        showToast("Error parsing CSV file.", "error");
                    }
                };
                reader.readAsText(file);
                e.target.value = null;
            };

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold text-slate-800">Database Management</h2>
                        <p className="text-slate-500 mt-1">Manage your underlying CSV database storage directly.</p>
                    </div>

                    <Card className="p-6">
                        <div className="flex flex-col gap-6">
                            <div className="pb-6 border-b border-slate-100 flex items-start justify-between">
                                <div>
                                    <h3 className="text-lg font-semibold text-slate-800 flex items-center gap-2"><Icons.Download /> Export Database</h3>
                                    <p className="text-sm text-slate-500 mt-1">Download the entire transaction history as a CSV file to your local machine.</p>
                                </div>
                                <button onClick={handleExport} className="px-4 py-2 bg-slate-800 text-white rounded-lg text-sm font-medium hover:bg-slate-900 transition-colors shadow-sm">
                                    Download CSV
                                </button>
                            </div>
                            
                            <div className="flex items-start justify-between">
                                <div>
                                    <h3 className="text-lg font-semibold text-slate-800 flex items-center gap-2"><Icons.Upload /> Import Database</h3>
                                    <p className="text-sm text-slate-500 mt-1">Upload a previously exported CSV file to restore or update system data.</p>
                                </div>
                                <label className="cursor-pointer px-4 py-2 bg-white border border-slate-300 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-50 transition-colors shadow-sm">
                                    <span>Upload CSV</span>
                                    <input type="file" accept=".csv" className="hidden" onChange={handleImport} />
                                </label>
                            </div>
                        </div>
                    </Card>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [userRole, setUserRole] = useState('Admin');
            
            const [transactions, setTransactions] = useState(() => {
                const saved = localStorage.getItem('b300_transactions');
                return saved ? JSON.parse(saved) : [];
            });

            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem('b300_settings');
                return saved ? JSON.parse(saved) : {
                    locations: ['Room A', 'Shelf 1', 'Secured Vault', 'QA Vault'],
                    strains: ['Blue Dream', 'Sour Diesel', 'OG Kush', 'Mixed Bio-mass'],
                    destructionReasons: ['Contamination', 'Expired', 'Quality Failure', 'Unhealthy Plant'],
                    witnesses: ['John Doe', 'Jane Smith'],
                    destructionPersons: ['Mike Johnson'],
                    destructionMethods: ['Incineration (CRA Approved)', 'Chemical Treatment (CRA Approved)']
                };
            });

            useEffect(() => {
                localStorage.setItem('b300_transactions', JSON.stringify(transactions));
            }, [transactions]);

            useEffect(() => {
                localStorage.setItem('b300_settings', JSON.stringify(settings));
            }, [settings]);

            const { showToast, ToastComponent } = useToast();

            const navItems = [
                { id: 'dashboard', label: 'Dashboard', icon: Icons.Dashboard },
                { id: 'ledger', label: 'Inventory Ledger', icon: Icons.List },
                { id: 'b300', label: 'B300 Generator', icon: Icons.FileText },
                { id: 'database', label: 'Data Management', icon: Icons.Database },
                { id: 'settings', label: 'Settings', icon: Icons.Settings },
            ];

            return (
                <div className="flex h-screen bg-slate-50 font-sans">
                    <div className="w-64 bg-slate-850 text-white flex flex-col shadow-xl z-10">
                        <div className="p-6 border-b border-slate-700/50">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 rounded-lg bg-brand-500 flex items-center justify-center">
                                    <span className="font-bold text-white leading-none">B</span>
                                </div>
                                <h1 className="font-bold text-lg tracking-tight">Compliance Cloud</h1>
                            </div>
                        </div>
                        <div className="flex-1 py-6 px-4 space-y-1">
                            {navItems.map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => setActiveTab(item.id)}
                                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                                        activeTab === item.id 
                                        ? 'bg-brand-600 text-white shadow-md' 
                                        : 'text-slate-400 hover:bg-slate-800 hover:text-white'
                                    }`}
                                >
                                    <item.icon />
                                    {item.label}
                                </button>
                            ))}
                        </div>
                        <div className="p-4 border-t border-slate-700/50">
                            <div className="bg-slate-800 rounded-lg p-3">
                                <p className="text-xs text-slate-400 uppercase tracking-wider font-semibold mb-2">Current Role</p>
                                <select 
                                    value={userRole}
                                    onChange={(e) => {
                                        setUserRole(e.target.value);
                                        showToast(`Switched to ${e.target.value} role`);
                                    }}
                                    className="w-full bg-slate-900 border border-slate-700 rounded text-sm text-white px-2 py-1 focus:outline-none focus:border-brand-500"
                                >
                                    <option value="Admin">Admin</option>
                                    <option value="Operator">Operator</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col overflow-hidden">
                        <header className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 z-0 shadow-sm">
                            <div className="text-sm font-medium text-slate-500">
                                {new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="text-sm text-slate-600 text-right">
                                    <p className="font-semibold text-slate-800">Acme Cannabis Co.</p>
                                    <p className="text-xs">LIC-CRA-998877</p>
                                </div>
                                <div className="w-10 h-10 rounded-full bg-brand-100 border-2 border-brand-200 flex items-center justify-center text-brand-700 font-bold">
                                    {userRole.charAt(0)}
                                </div>
                            </div>
                        </header>

                        <main className="flex-1 overflow-y-auto p-8 bg-slate-50/50">
                            <div className="max-w-6xl mx-auto">
                                {activeTab === 'dashboard' && <DashboardView transactions={transactions} />}
                                {activeTab === 'ledger' && <TransactionsView transactions={transactions} setTransactions={setTransactions} userRole={userRole} showToast={showToast} settings={settings} setSettings={setSettings} />}
                                {activeTab === 'b300' && <B300View transactions={transactions} showToast={showToast} />}
                                {activeTab === 'database' && <DatabaseView transactions={transactions} setTransactions={setTransactions} showToast={showToast} />}
                                {activeTab === 'settings' && <SettingsView settings={settings} setSettings={setSettings} showToast={showToast} />}
                            </div>
                        </main>
                    </div>
                    
                    <ToastComponent />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
