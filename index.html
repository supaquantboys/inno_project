<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B300 Compliance Cloud</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f3f4f6;color:#111827}
    body{display:flex;flex-direction:column;overflow:hidden}.topbar{height:54px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#fff;border-bottom:1px solid #e5e7eb;box-shadow:0 1px 2px rgba(0,0,0,.03);z-index:10}.brand-wrap{position:relative}.brand{border:0;background:transparent;display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;color:#111827;cursor:pointer;padding:7px 9px;border-radius:9px}.brand:hover{background:#f3f4f6}.brand-mark{width:27px;height:27px;border-radius:8px;background:#059669;color:#fff;display:grid;place-items:center;font-size:13px}.chev{font-size:11px;color:#6b7280}.menu{position:absolute;top:43px;left:0;width:290px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 12px 30px rgba(15,23,42,.14);padding:8px;display:none}.menu.open{display:block}.menu-title{padding:7px 10px 5px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9ca3af}.menu button{width:100%;border:0;background:#fff;text-align:left;border-radius:9px;padding:10px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}.menu button:hover{background:#f3f4f6}.menu button.active{background:#ecfdf5}.menu strong{display:block;font-size:13px}.menu small{display:block;color:#6b7280;margin-top:3px;line-height:1.35}.badge{align-self:flex-start;font-size:10px;font-weight:800;border-radius:999px;padding:3px 7px;background:#e5e7eb;color:#4b5563}.active .badge{background:#d1fae5;color:#047857}.spacer{flex:1}.mode-label{font-size:12px;color:#6b7280}.mode-label b{color:#111827}.isolation{font-size:11px;color:#047857;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:999px;padding:5px 9px;white-space:nowrap}.frame{flex:1;width:100%;border:0;min-height:0;background:#f3f4f6}.loading{position:absolute;inset:54px 0 0;display:grid;place-items:center;background:#f3f4f6;color:#6b7280;font-size:13px;z-index:1;pointer-events:none;opacity:0;transition:opacity .15s}.loading.show{opacity:1}@media(max-width:700px){.mode-label,.isolation{display:none}.topbar{padding:0 9px}.brand{font-size:14px}.menu{width:min(290px,calc(100vw - 18px))}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <button class="brand" id="brandBtn" aria-haspopup="true" aria-expanded="false">
        <span class="brand-mark">B3</span><span>B300 Compliance Cloud</span><span class="chev">▼</span>
      </button>
      <div class="menu" id="versionMenu" role="menu">
        <div class="menu-title">Compare product experiences</div>
        <button id="legacyBtn" type="button"><span><strong>Legacy</strong><small>Existing ledger-first compliance workflow.</small></span><span class="badge">OLD</span></button>
        <button id="v2Btn" type="button"><span><strong>Batch Manager v2</strong><small>New action-first workflow with isolated data.</small></span><span class="badge">NEW</span></button>
      </div>
    </div>
    <div class="mode-label">Viewing: <b id="modeName">Legacy</b></div>
    <div class="spacer"></div>
    <div class="isolation" id="isolationLabel">Separate data stores</div>
  </header>
  <div class="loading" id="loading">Switching workspace…</div>
  <iframe id="appFrame" class="frame" title="B300 Compliance Cloud workspace" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-modals" referrerpolicy="same-origin"></iframe>

  <script>
    (() => {
      const frame = document.getElementById('appFrame');
      const menu = document.getElementById('versionMenu');
      const brand = document.getElementById('brandBtn');
      const modeName = document.getElementById('modeName');
      const loading = document.getElementById('loading');
      const legacyBtn = document.getElementById('legacyBtn');
      const v2Btn = document.getElementById('v2Btn');
      const views = {
        legacy: { src: './legacy.html', name: 'Legacy', button: legacyBtn },
        v2: { src: './batch-manager-v2.html', name: 'Batch Manager v2', button: v2Btn }
      };
      const getRequestedView = () => new URLSearchParams(location.search).get('view') === 'v2' ? 'v2' : 'legacy';
      let current = getRequestedView();
      function closeMenu(){ menu.classList.remove('open'); brand.setAttribute('aria-expanded','false'); }
      function openView(view, push = true){
        if (!views[view]) view = 'legacy';
        current = view; loading.classList.add('show');
        frame.src = views[view].src;
        modeName.textContent = views[view].name;
        [legacyBtn,v2Btn].forEach(b => b.classList.remove('active'));
        views[view].button.classList.add('active');
        if (push) history.pushState({view},'',`?view=${view}`);
        closeMenu();
      }
      brand.addEventListener('click', e => { e.stopPropagation(); const isOpen = menu.classList.toggle('open'); brand.setAttribute('aria-expanded', String(isOpen)); });
      legacyBtn.addEventListener('click', () => openView('legacy'));
      v2Btn.addEventListener('click', () => openView('v2'));
      document.addEventListener('click', closeMenu);
      frame.addEventListener('load', () => loading.classList.remove('show'));
      addEventListener('popstate', () => openView(getRequestedView(), false));
      openView(current, false);
    })();
  </script>
</body>
</html>
