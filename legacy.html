<!DOCTYPE html><html lang="en-CA"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B300 Compliance Workspace</title><style>html,body{height:100%;margin:0}.frame{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="f" class="frame" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-modals"></iframe><script>(()=>{let s=null;try{s=JSON.parse(sessionStorage.getItem('b300_auth_session')||'null')}catch(_){}if(!s||s.workspace!=='v1'||s.username!=='operator'){location.replace('./');return}const f=document.getElementById('f');let testUnlocked=sessionStorage.getItem('marryWannaFreeUnlock')==='1';const features=()=>{if(testUnlocked)return new Set(['b300_reports','audit_log','administration']);try{const x=JSON.parse(localStorage.getItem('marryWannaOfflineLicense')||'null');return new Set(x?.payload?.features||[])}catch(_){return new Set()}};let childDoc=null,scanNow=()=>{};const roleSelect=()=>childDoc?[...childDoc.querySelectorAll('select')].find(el=>{const values=[...el.options].map(o=>o.value);return values.includes('Admin')&&values.includes('Operator')}):null;const getRole=()=>roleSelect()?.value||null;const setRole=role=>{const select=roleSelect();if(!select||!['Admin','Operator'].includes(role))return null;select.value=role;select.dispatchEvent(new childDoc.defaultView.Event('change',{bubbles:true}));setTimeout(()=>window.parent.postMessage({type:'b300-legacy-role',role},location.origin),0);return role};window.B300LegacyRole={get:getRole,set:setRole,toggle:()=>{const current=getRole();return setRole(current==='Admin'?'Operator':'Admin')}};window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='marrywanna-test-unlock')return;testUnlocked=!!e.data.enabled;scanNow()});f.src='./legacy-app.html';f.addEventListener('load',()=>{try{const d=f.contentDocument,w=f.contentWindow;if(!d||!d.body)return;childDoc=d;const messages={Other:'B300 “Other” is an exceptional reporting line. Use a specific B300 category whenever one applies.','Manual Count Adjustment':'Manual inventory adjustments are exceptional compliance/reconciliation actions and should not be used for routine operations.','System Correction':'System corrections change reported inventory. Confirm the reason and supporting record before saving.','Audit Finding':'Audit adjustments should be supported by the audit finding and retained documentation.',Adjustments:'Inventory adjustments are a compliance control, not a routine inventory workflow.'};function hideLegacyChrome(){const version=[...d.querySelectorAll('p,span,div')].find(el=>el.childElementCount===0&&el.textContent.trim()==='Compliance MVP v1.3');if(version){const top=version.closest('div.border-b')||version.parentElement?.parentElement;if(top)top.style.display='none'}const roleLabel=[...d.querySelectorAll('span')].find(el=>el.textContent.trim()==='Simulate Role:');if(roleLabel){const control=roleLabel.closest('div.flex.items-center.justify-between');const outer=control?.parentElement;if(outer)outer.style.display='none';else if(control)control.style.display='none'}const identity=[...d.querySelectorAll('span')].find(el=>/^(Jane Doe \(Admin\)|John Smith \(Operator\))$/.test(el.textContent.trim()));if(identity){const header=identity.closest('header');if(header)header.style.display='none'}const nav=d.querySelector('nav.flex-1');if(nav){nav.style.paddingTop='8px';nav.style.marginTop='0'}}function featureVisibility(){const set=features(),rules=[{feature:'b300_reports',terms:['report']},{feature:'audit_log',terms:['audit']},{feature:'administration',terms:['database','setting','admin']}];[...d.querySelectorAll('button,a')].forEach(el=>{const text=(el.textContent||'').trim().toLowerCase(),id=(el.id||'').toLowerCase();for(const rule of rules){if(rule.terms.some(t=>text.includes(t)||id.includes(t))){el.style.display=set.has(rule.feature)?'':'none';break}}})}function scan(){hideLegacyChrome();const value=[...d.querySelectorAll('select')].map(x=>x.value).find(v=>messages[v]);let el=d.getElementById('b300-compliance-warning');if(!value){if(el)el.remove()}else{if(!el){el=d.createElement('div');el.id='b300-compliance-warning';el.style.cssText='position:fixed;right:18px;top:18px;z-index:99999;width:min(380px,calc(100vw - 36px));padding:12px 14px;border:1px solid #f59e0b;border-radius:10px;background:#fffbeb;color:#92400e;box-shadow:0 10px 28px rgba(15,23,42,.16);font:13px/1.45 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif';d.body.appendChild(el)}el.innerHTML='<b>Compliance warning</b><br>'+messages[value]}featureVisibility()}scanNow=scan;d.addEventListener('change',scan,true);new w.MutationObserver(scan).observe(d.body,{childList:true,subtree:true});scan();setTimeout(()=>window.parent.postMessage({type:'b300-legacy-role',role:getRole()||'Admin'},location.origin),50)}catch(e){console.warn('Compliance workspace helper unavailable',e)}});})();</script></body></html>
